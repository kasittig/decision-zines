name: Implementation task
description: Propose a focused, independently verifiable change
title: ""
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should become observably true?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful, and which project goal does it support?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include affected contracts and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable checklist items.
      placeholder: "- [ ] Observable result"
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands, fixtures, rendered pages, and manual checks.
    validations:
      required: true

