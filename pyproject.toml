[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-based-teaching-zine"
version = "0.0.0"
description = "Contract-first publishing system for decision-based teaching zines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pypdf>=5,<6",
  "PyYAML>=6,<7",
  "reportlab>=4,<5",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
